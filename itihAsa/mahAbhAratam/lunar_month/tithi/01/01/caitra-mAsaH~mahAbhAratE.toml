shlokas = """
चैत्रं तु नियतो मासमेकभक्तेन यः क्षिपेत् ।
सुवर्णमणिमुक्ताढ्ये कुले महति जायते॥१३-१६३-२२॥
चैत्रमासं तु यो राजन्नेकभुक्तेन वर्तते ।
ब्रह्मचारी च मद्भक्त्या तस्य पुण्यफलं शृणु॥१४-११३-२६॥
यदग्निहोत्रिणः पुण्यं यथोक्तं व्रतचारिणः ।
तत्पुण्यफकलमासाद्य चन्द्रलोके महीयते॥१४-११३-२७॥
ततोऽवतीर्णो जायेत वर्षे रमणके पुनः ।
भुक्त्वा कामांस्ततस्तस्मिन्निह राजा भविष्यति॥१४-११३-२८॥
---महाभारते (कुम्भघोण-संस्करणम्)
अस्मिन्सरसि सत्रैर्वै चैत्रे मासि पिनाकिनम् ।
यजन्ते याजकाः सम्यक् परिवारं शुभार्थिनः॥३-१३२-१५॥
अत्रोपस्पृश्य सरसि श्रद्दधानो जितेन्द्रियः ।
क्षीणपापः शुभाँल्लोकान्प्राप्नुते नात्र संशयः॥३-१३२-१६॥
---महाभारते (कुम्भघोण-संस्करणम्)
"""
